name: SplitKana
options:
  bundleIdPrefix: com.splitkana
  deploymentTarget:
    iOS: "17.0"

# 署名の切り替えはここだけ直せば済む。
#
# - DEVELOPMENT_TEAM
#     Xcode の Settings → Accounts に出ているチームID。
#     Xcode の「Signing & Capabilities」で選んだものと同じ値にすること。
#     異なると `xcodegen generate` のたびに選択が上書きされる。
#
# - SPLITKANA_BUNDLE_PREFIX
#     Bundle ID の頭。**チームを変えるときは必ず一緒に変える。**
#     明示的な App ID はアカウントをまたいで一意なので、
#     前のチームが登録済みの Bundle ID は新しいチームでは登録できない。
#     変えると iPad は別のアプリとして扱う（学習データは引き継がれない）。
settings:
  base:
    DEVELOPMENT_TEAM: PPB74JD3JG
    SPLITKANA_BUNDLE_PREFIX: com.splitkana

packages:
  SplitKanaKit:
    path: Packages/SplitKanaKit
  AzooKeyKanaKanjiConverter:
    url: https://github.com/ensan-hcl/AzooKeyKanaKanjiConverter
    exactVersion: 0.9.0

targets:
  SplitKanaHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/SplitKanaHost
    dependencies:
      - package: SplitKanaKit
        product: SplitKanaCore
      - package: SplitKanaKit
        product: SplitKanaUI
      # 拡張は単体で配布できない。必ず本体に同梱する（SPEC 8）。
      - target: SplitKanaKeyboard
        embed: true
    info:
      path: Generated/SplitKanaHost-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITKANA_BUNDLE_PREFIX).host
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  # キーボード拡張（SPEC 7 フェーズ2）。
  # Bundle ID は必ず親アプリの Bundle ID + サフィックスにする。
  SplitKanaKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Keyboard
    dependencies:
      - package: SplitKanaKit
        product: SplitKanaCore
      - package: SplitKanaKit
        product: SplitKanaUI
      - package: AzooKeyKanaKanjiConverter
        product: KanaKanjiConverterModuleWithDefaultDictionary
    info:
      path: Generated/SplitKanaKeyboard-Info.plist
      properties:
        # 空だとインストール自体が拒否される。設定 → キーボード に出る名前でもある。
        CFBundleDisplayName: 分割かな
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: ja-JP
            IsASCIICapable: false
            PrefersRightToLeft: false
            # 触覚と App Group はフルアクセスが要るので当面 false（SPEC 4）。
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITKANA_BUNDLE_PREFIX).host.keyboard
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

# スキームは共有保存しておく。
# 定義しないと Xcode が各ターゲットぶんを勝手に作り、xcodegen generate のたびに
# 選択がリセットされる。拡張のスキームが選ばれていると ⌘R が
# 「Choose an app to run」になって起動できない。
schemes:
  SplitKanaHost:
    build:
      targets:
        SplitKanaHost: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
